<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente lineal de violeta a turquesa para el círculo y formas -->
    <linearGradient id="gradient3d" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#9d4edd" /> <!-- Violeta vibrante -->
      <stop offset="50%" stop-color="#3b82f6" /> <!-- Azul corporativo -->
      <stop offset="100%" stop-color="#00f5d4" /> <!-- Turquesa brillante -->
    </linearGradient>

    <!-- Sombra suave para simular profundidad en la superposición -->
    <filter id="shadow3d" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Círculo exterior fino con degradado -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#gradient3d)" stroke-width="4.5" />

  <!-- Isotipo: Toroide estilizado en espiral 3D -->
  <g transform="translate(10, 10)">
    <!-- Parte trasera del anillo (base) -->
    <path d="M 90,32 A 58,58 0 1,0 138,122 L 132,108 A 43,43 0 1,1 90,47 Z" 
          fill="url(#gradient3d)" opacity="0.9" />

    <!-- Sombra del solape para dar efecto 3D de profundidad -->
    <path d="M 40,78 A 54,54 0 0,0 80,144 L 84,128 A 38,38 0 0,1 52,78 Z" 
          fill="#000" filter="url(#shadow3d)" opacity="0.65" />

    <!-- Parte delantera del anillo (solapamiento frontal en 3D) -->
    <path d="M 90,32 A 58,58 0 0,1 148,90 A 58,58 0 0,1 90,148 A 58,58 0 0,1 36,104 L 51,94 A 43,43 0 0,0 90,133 A 43,43 0 0,0 133,90 A 43,43 0 0,0 90,47 Z" 
          fill="url(#gradient3d)" />
  </g>
</svg>
